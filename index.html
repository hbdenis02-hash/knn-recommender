
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>시범 페이지</title>
  <script src="script.js"></script>
</head>
<body>

  <div id="header">
    <div id="header-content">
      <p>성함을 기입해주세요.</p>
      <input type="text" id="name" name="name" placeholder="이름을 입력하세요"> 
      <p>*본 설문조사는 대학교 재학생 휴학생 대상입니다</p>
    </div>

    <h3>체크박스</h3> 


    <div id=checkbox1">
      <h4>* Q1.본인의 신분을 선택해주세요.</h4>
      <label><input type="checkbox" name="option1">재학생</label>
      <label><input type="checkbox" name="option1">휴학생</label>
      <label><input type='checkbox' name ="option1">졸업생</label>
    </div>
          
    <div id=checkbox2">
      <h4>* Q2.본인의 학년을 선택해주세요.</h4>
      <label><input type="checkbox" name="option2">1학년</label>
      <label><input type="checkbox" name="option2">2학년</label>
      <label><input type='checkbox' name ="option2">3학년</label>
      <label><input type='checkbox' name ="option2">4학년</label>
    </div>



               


    <div id="checkbox3">
      <h4>Q3. 당신의 소속 대학을 선택해주세요</h4>
      <label><input type="checkbox" name="option3"> 사범대학</label><br>
      <label><input type="checkbox" name="option3"> 공과대학</label><br>
      <label><input type="checkbox" name="option3"> 사회과학대학</label><br>
      <label><input type="checkbox" name="option3"> 자연과학대학</label><br>
      <label><input type="checkbox" name="option3"> 인문콘텐츠학부</label><br>
      <label><input type="checkbox" name="option3">기타</label>
    </div>
    
    <div id="checkbox4">
      <h4>Q4. 자신이 비교과 프로그램을 지원한다면 가장 중요하게 보는 것은?</h4>
      <label><input type="checkbox" name="option4"> 취업</label><br>
      <label><input type="checkbox" name="option4"> 학업</label><br>
      <label><input type="checkbox" name="option4"> 건강/스포츠</label><br>
      <label><input type="checkbox" name="option4"> 친구/인맥</label><br>
      <label><input type="checkbox" name="option4"> 기타</label><br>
    </div>

    <div id="checkbox5">
      <h4>평소에 관심 있는 분야는 </h4>
      <label><input type="checkbox5" name="option5"> 공예/디자인</label><br>
      <label><input type="checkbox5" name="option5"> 과학/기술</label><br>
      <label><input type="checkbox5" name="option5"> 스포츠/건강</label><br>
      <label><input type="checkbox5" name="option5"> 음악/예술</label><br>
      <label><input type="checkbox5" name="option5"> 기타</label><br>
    </div>


    <div id="checkbox6">
      <h4>본인이 이 중에서 관심이어하는 비교과 활동 프로그램에는? </h4>
      <label><input type="checkbox" name="answer"> (기초)AI를 활용한 실전 사용법</label><br>
      <label><input type="checkbox" name="anwer"> (글쓰기 특강)내 ChatGPT만 왜 그럴까</label><br>
      <label><input type="checkbox" name="answer"> 2026_2학기_신직업 멘토링 </label><br>
      <label><input type="checkbox" name="answer"> 퍼스널퍼퓸"나를 표현하는 향"</label><br>
      <label><input type="checkbox" name="answer"> 기타</label><br>
    </div>

    
    <br>

    <button type="button" onclick="makeTable(), saveToGoogleSheet()">선택된 옵션 확인</button>
  </div>

 

</body>
</html>
